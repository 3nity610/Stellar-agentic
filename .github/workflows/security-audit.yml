name: Security Audit

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  schedule:
    # Run security audits daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  # ── Rust Security Audit ───────────────────────────────────────────────────────
  rust-audit:
    name: Rust Security Audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace:
          - contracts
          - zk
          - sdk/rust
          - services/signer
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.workspace }}

      - name: Run cargo audit
        run: |
          cargo install cargo-audit
          cargo audit
        continue-on-error: false

  # ── TypeScript/JavaScript Security Audit ───────────────────────────────────────
  pnpm-audit:
    name: pnpm Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --audit-level moderate
        # Fail on moderate or higher severity vulnerabilities
        # Documented severity threshold: moderate (low is informational only)

  # ── Python Security Audit ─────────────────────────────────────────────────────
  python-audit:
    name: Python Security Audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: python/pyproject.toml

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit
        continue-on-error: false
