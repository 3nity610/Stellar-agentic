global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # The indexer's query server exposes Prometheus text at /metrics on the same
  # port as the audit API. Adjust the host to wherever `stellaragent-indexer
  # tail` is running; host.docker.internal reaches the host from this
  # container, plain localhost only works if the indexer is in the compose
  # network. See packages/indexer/README.md#observability for the metric list.
  - job_name: stellaragent-indexer
    static_configs:
      - targets: ["host.docker.internal:3001"]
